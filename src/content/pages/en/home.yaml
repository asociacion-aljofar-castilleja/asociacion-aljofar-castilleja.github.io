whatWeDo:
  services:
    - { title: "Morning classroom", excerpt: "Reinforcement of reading, writing, numeracy and memory. Oct–Jun · Mon–Fri 10:00–13:00 · Civic Center.", href: "/en/what-we-do#services", icon: "bi bi-mortarboard" }
  workshops:
    - { title: "Crafts workshop", excerpt: "Creativity and psychomotor skills; useful and decorative pieces.", href: "/que-hacemos#talleres", icon: "bi bi-scissors" }
    - { title: "Dance workshop", excerpt: "Physical activity and musical expression with adapted choreographies.", href: "/que-hacemos#talleres", icon: "bi bi-music-note-beamed" }
    - { title: "IT workshop", excerpt: "Train users in basic computer skills.", href: "/que-hacemos#talleres", icon: "bi bi-pc-display" }
  projects:
      - { title: "Leisure and free time", excerpt: "Excursions, coexistence (Christmas lunch) and December 3: International Day of Persons with Disabilities.", href: "/que-hacemos#talleres", icon: "bi bi-calendar-event" }
      - { title: "Charity stalls", excerpt: "Stands with products made in the workshop to raise awareness and funds.", href: "/que-hacemos#talleres", icon: "bi bi-shop" }

