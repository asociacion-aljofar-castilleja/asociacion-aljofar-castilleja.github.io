title: "About Us"
description: "Learn about our mission, vision and values."
heroTitle: "We are community and technology"
heroSubtitle: "Learning by creating, to transform our environment."

sections:
  - title: "Mission"
    paragraphs:
      - "To promote the integration, training and personal and social development of people with functional, mental, physical and sensory diversity, fostering their autonomy and active participation in society."
  - title: "Vision"
    paragraphs:
      - "To be a leading association in inclusion and happiness, where each person can fully develop, share experiences and feel valued for who they are, not for their limitations."
  - title: "Values"
    paragraphs:
      - "Inclusion: Everyone has a place in society."
      - "Respect: We value diversity as a strength."
      - "Autonomy: We foster independence and lifelong learning."
      - "Solidarity: We grow together by supporting one another."

