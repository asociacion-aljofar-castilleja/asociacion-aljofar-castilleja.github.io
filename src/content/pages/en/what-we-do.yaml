title: "What we do"
description: "ALJÓFAR’s programs, projects and workshops for the inclusion, training and development of people with disabilities."
heroTitle: "What We Do"
heroSubtitle: "Workshops, services and activities."

# ------- Services / Programs -------
servicios:
  - nombre: "Morning classroom"
    imagen: "/images/servicios/aula-matinal.jpg"
    objetivo: "Training in various educational subjects, fostering writing, reading, arithmetic, memory, and the overall development of participating members."
    destinatarios: "Members of the association."
    requisitos: "No prior registration is required."
    horario_lugar: "From October to June, Monday to Friday, from 10:00 to 13:00 in the classroom at the Civic Center."
    como_solicitar: "Come to the classroom during activity hours or contact the association."
    accesibilidad: "Accessible activity."

# ------- Projects -------
proyectos:
  - tipo: "actividad"
    titulo: "Leisure and community activities"
    fecha: "Throughout the year"
    lugar: "Public spaces and social centres in Castilleja de la Cuesta"
    edad: "All ages"
    organizador: "ALJÓFAR Association"
    info: >
      Throughout the year we organise outings, trips, and community events such
      as the Christmas gathering and the celebration of the International Day of
      Persons with Disabilities (3rd of December). These are moments to share,
      connect, and enjoy together as a community.
    imagen:
      src: "/images/actividades-ocio/castilleja-de-la-cuesta.jpg"
      alt: "People taking part in a leisure activity organised by the association"
      aspectRatio: "4/3"

  - tipo: "puesto"
    titulo: "Solidarity craft stalls"
    fecha: "Several dates throughout the year"
    ubicacion: "Local fairs and community events"
    productos: "Handicrafts and items made in our workshops"
    contacto: "ALJÓFAR Association — info@asociacionaljofarcastilleja.es"
    info: >
      We set up solidarity stalls where we sell the pieces created in the
      handicraft workshop. The funds raised help sustain the association’s
      activities and support new social projects.
    imagen:
      src: "/images/actividades-ocio/puestos-artesania.jpg"
      alt: "Solidarity stall displaying the association’s handmade products"
      aspectRatio: "4/3"


# ------- Workshops & Activities -------
talleres:
  - titulo: "Craft Workshop"
    descripcion: >
      Encourages creativity and psychomotor skills through the creation
      of useful and decorative items.
    horario_lugar: "Throughout the year at the Nueva Sevilla Civic Center. In-person."
    imagenes:
      - src: "/images/taller-manualidades/manualidades-cuencos/cuencos2.jpg"
        alt: "Members making bowls"
      - src: "/images/taller-manualidades/manualidades-abanico/abanico2.jpg"
        alt: "Members making fans"
      - src: "/images/taller-manualidades/manualidades-camisetas/camisetas2.jpg"
        alt: "Members painting t-shirts"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-1.jpg"
        alt: "Members making keychains"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-3.jpg"
        alt: "Members painting pictures"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-2.jpg"
        alt: "Members decorating mugs"

  - titulo: "Computer Workshop"
    descripcion: >
      Introduction to computers: basic use of the computer, word processors,
      and safe internet browsing.
    horario_lugar: "During the course at the Nueva Sevilla Civic Center. In-person, 3 computers available."
    imagenes:
      - src: "/images/sede-informatica/informatica2.jpg"
        alt: "Members learning computer skills"

  - titulo: "Dance Workshop"
    descripcion: >
      Physical and recreational activity promoting coordination, rhythm,
      and socialization through various dance styles.
    horario_lugar: "During the course at the Nueva Sevilla Civic Center. In-person."
    imagenes:
      - src: "/images/taller-baile/baile.png"
        alt: "Members dancing in the workshop"
