# ------- Projects (funded, grants, results) -------
proyectos:
  - tipo: "actividad"
    titulo: "Leisure and Community Activities"
    fecha: "Throughout the year"
    lugar: "Various public spaces and community centers"
    horario: "Specific dates according to the annual schedule"
    precio: "Free or symbolic contribution"
    edad: "All ages"
    organizador: "Aljofar Association"
    notas: >
      Every year we organize different outings and community gatherings
      to promote participation and well-being among our members.
      Highlights include the Christmas lunch, the end-of-year excursion,
      and the International Day of Persons with Disabilities celebration
      held every December 3rd.
    imagen:
      src: "/images/ocio-actividades.jpg"
      alt: "Group of people enjoying a community leisure activity"
      aspectRatio: "4/3"

  - tipo: "puesto"
    titulo: "Handcraft Fundraising Stalls"
    fecha: "Several times a year"
    ubicacion: "Local fairs and community events"
    horario: "According to each event’s schedule"
    productos: "Handmade items created in our craft workshops"
    contacto: "Aljofar Association — info@asociacionaljofarcastilleja.es"
    notas: >
      We set up fundraising stalls to sell handcrafted items made
      during our manual arts workshops. All proceeds are used to
      support the association’s self-financing and new social initiatives.
    imagen:
      src: "/images/puesto-artesania.jpg"
      alt: "Table displaying handmade crafts at a community fundraising stall"

# ------- Workshops & Activities (with optional gallery) -------
talleres:
  - titulo: "Taller de Manualidades"
    descripcion: >
      Fomenta la creatividad y habilidades psicomotrices mediante la
      elaboración de objetos útiles y decorativos.
    horario_lugar: "Durante todo el año en el Centro Cívico de Nueva Sevilla. Modalidad presencial."
    imagenes:
      - src: "/images/taller-manualidades/manualidades-cuencos/cuencos2.jpg"
        alt: "Socios creando cuencos"
      - src: "/images/taller-manualidades/manualidades-abanico/abanico2.jpg"
        alt: "Socios creando abanicos"
      - src: "/images/taller-manualidades/manualidades-camisetas/camisetas2.jpg"
        alt: "Socios pintando camisetas"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-1.jpg"
        alt: "Socios creando llaveros"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-3.jpg"
        alt: "Socios pintando cuadros"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-2.jpg"
        alt: "Socios decorando tazas"

  - titulo: "Taller de Informática"
    descripcion: >
      Iniciación a la informática: uso básico del ordenador,
      procesadores de texto y navegación segura por internet.
    horario_lugar: >
      Durante el curso en el Centro Cívico de Nueva Sevilla.
      Modalidad presencial, 3 equipos disponibles.
    imagenes:
      - src: "/images/sede-informatica/informatica2.jpg"
        alt: "Socios aprendiendo informática"

  - titulo: "Taller de Baile"
    descripcion: >
      Actividad física y recreativa que promueve coordinación, ritmo
      y socialización mediante distintos estilos de baile.
    horario_lugar: "Durante el curso en el Centro Cívico de Nueva Sevilla. Modalidad presencial."
    imagenes:
      - src: "/images/taller-baile/baile.jpg"
        alt: "Socios bailando en el taller de baile"