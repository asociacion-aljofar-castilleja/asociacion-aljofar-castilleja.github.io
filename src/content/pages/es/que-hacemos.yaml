title: "Qué hacemos"
description: "Programas, proyectos y talleres de ALJÓFAR para la integración, formación y desarrollo de personas con diversidad funcional."
heroTitle: "Qué hacemos"
heroSubtitle: "Talleres, servicios y actividades."

# ------- Servicios / Programas -------
servicios:
  - nombre: "Aula matinal"
    imagen: "/images/servicios/aula-matinal.jpg"
    objetivo: "Formación en diversas materias didácticas fomentando la escritura, lectura, cálculo, memoria y el desarrollo integral de los socios participantes."
    destinatarios: "Socios y socias participantes de la asociación."
    requisitos: "No se requiere inscripción previa."
    horario_lugar: "De octubre a junio, de lunes a viernes, de 10:00 a 13:00 horas en el aula del Centro Cívico."
    como_solicitar: "Acudir al aula en horario de actividad o contactar con la asociación."
    accesibilidad: "Actividad accesible."

# ------- Proyectos (financiados, subvenciones, resultados) -------
proyectos:
  - tipo: "actividad"
    titulo: "Actividades de ocio y convivencia"
    fecha: "A lo largo del año"
    lugar: "Distintos espacios públicos y centros sociales"
    horario: "Fechas puntuales según programación anual"
    precio: "Gratuito o con aportación simbólica"
    edad: "Todas las edades"
    organizador: "Asociación Aljofar"
    notas: >
      Cada año organizamos distintas salidas y jornadas de convivencia
      para fomentar la participación y el bienestar de las personas asociadas.
      Entre ellas destacan la comida de Navidad, las excursiones de fin de curso
      y la celebración del Día de la Diversidad Funcional, cada 3 de diciembre.
    imagen:
      src: "/images/ocio-actividades.jpg"
      alt: "Grupo de personas disfrutando de una jornada de convivencia"
      aspectRatio: "4/3"

  - tipo: "puesto"
    titulo: "Puestos solidarios de artesanía"
    fecha: "Varias veces al año"
    ubicacion: "Ferias locales y eventos comunitarios"
    horario: "Según horario del evento"
    productos: "Artículos elaborados en el taller de manualidades"
    contacto: "Asociación Aljofar — info@asociacionaljofarcastilleja.es"
    notas: >
      Organizamos puestos de venta con los productos realizados en el taller
      de manualidades. La recaudación se destina a la autofinanciación de la
      asociación y a apoyar nuevas actividades y proyectos sociales.
    imagen:
      src: "/images/puesto-artesania.jpg"
      alt: "Mesa con productos artesanales en un puesto solidario"


# ------- Talleres y Actividades (con galería opcional) -------
workshops:
  - title: "Handcraft Workshop"
    description: >
      Encourages creativity and fine motor skills through the creation
      of useful and decorative handmade items.
    schedule_location: "Year-round at the Nueva Sevilla Civic Center. In-person modality."
    images:
      - src: "/images/taller-manualidades/manualidades-cuencos/cuencos2.jpg"
        alt: "Members creating handmade bowls"
      - src: "/images/taller-manualidades/manualidades-abanico/abanico2.jpg"
        alt: "Members crafting hand fans"
      - src: "/images/taller-manualidades/manualidades-camisetas/camisetas2.jpg"
        alt: "Members painting T-shirts"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-1.jpg"
        alt: "Members making keychains"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-3.jpg"
        alt: "Members painting small canvases"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-2.jpg"
        alt: "Members decorating mugs"

  - title: "Computer Skills Workshop"
    description: >
      Introduction to computing: basic use of a computer, word
      processors, and safe internet browsing.
    schedule_location: >
      During the school year at the Nueva Sevilla Civic Center.
      In-person modality, with 3 computers available.
    images:
      - src: "/images/sede-informatica/informatica2.jpg"
        alt: "Members learning computer skills"

  - title: "Dance Workshop"
    description: >
      Physical and recreational activity that promotes coordination,
      rhythm, and social interaction through different dance styles.
    schedule_location: "During the school year at the Nueva Sevilla Civic Center. In-person modality."
    images:
      - src: "/images/taller-baile/baile.jpg"
        alt: "Members dancing during the workshop"
