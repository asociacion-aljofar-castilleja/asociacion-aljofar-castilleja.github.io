title: "Qué hacemos"
description: "Programas, proyectos y talleres de ALJÓFAR para la integración, formación y desarrollo de personas con diversidad funcional."
heroTitle: "Qué hacemos"
heroSubtitle: "Talleres, servicios y actividades."

# ------- Servicios / Programas -------
servicios:
  - nombre: "Aula matinal"
    imagen: "/images/servicios/aula-matinal.jpg"
    objetivo: "Formación en diversas materias didácticas fomentando la escritura, lectura, cálculo, memoria y el desarrollo integral de los socios participantes."
    destinatarios: "Socios y socias participantes de la asociación."
    requisitos: "No se requiere inscripción previa."
    horario_lugar: "De octubre a junio, de lunes a viernes, de 10:00 a 13:00 horas en el aula del Centro Cívico."
    como_solicitar: "Acudir al aula en horario de actividad o contactar con la asociación."
    accesibilidad: "Actividad accesible."

# ------- Proyectos -------
proyectos:
  - tipo: "actividad"
    titulo: "Actividades de ocio y convivencia"
    fecha: "Durante todo el año"
    lugar: "Espacios públicos y centros sociales de Castilleja de la Cuesta"
    edad: "Todas las edades"
    organizador: "Asociación ALJÓFAR"
    info: >
      A lo largo del año organizamos salidas, excursiones y jornadas de convivencia,
      como la comida de Navidad o la celebración del Día Internacional de las Personas
      con Discapacidad (3 de diciembre). Son momentos para compartir, relacionarnos
      y disfrutar en comunidad.
    imagen:
      src: "/images/actividades-ocio/castilleja-de-la-cuesta.jpg"
      alt: "Personas participando en una actividad de ocio organizada por la asociación"
      aspectRatio: "4/3"

  - tipo: "puesto"
    titulo: "Puestos solidarios de artesanía"
    fecha: "Varias fechas al año"
    ubicacion: "Ferias y eventos locales"
    productos: "Artesanía y productos elaborados en los talleres"
    contacto: "Asociación ALJÓFAR — info@asociacionaljofarcastilleja.es"
    info: >
      Montamos puestos solidarios donde vendemos las piezas realizadas en el taller
      de manualidades. La recaudación se destina a mantener las actividades de la
      asociación y a impulsar nuevos proyectos sociales.
    imagen:
      src: "/images/actividades-ocio/puestos-artesania.jpg"
      alt: "Puesto solidario con productos artesanales de la asociación"
      aspectRatio: "4/3"

    titulo: "Puestos solidarios de artesanía"
    fecha: "Varias veces al año"
    ubicacion: "Ferias locales y eventos comunitarios"
    horario: "Estos puestos se realizan durante todo el año"
    productos: "Organizamos puestos para la venta de los artículos realizados en el taller de manualidades, recaudando fondos para la autofinanciación."
    contacto: "Asociación Aljofar — info@asociacionaljofarcastilleja.es"
    notas: >
      Organizamos puestos de venta con los productos realizados en el taller de manualidades. La recaudación se destina a la autofinanciación de la asociación y a apoyar nuevas actividades y proyectos sociales.
    imagen:
      src: "/images/actividades-ocio/puestos-artesania.jpg"
      alt: "Mesa con nuestros productos artesanales en un puesto solidario"
      aspectRatio: "4/3"

# ------- Talleres y Actividades (con galería opcional) -------
talleres:
  - titulo: "Taller de Manualidades"
    descripcion: >
      Fomenta la creatividad y habilidades psicomotrices mediante la
      elaboración de objetos útiles y decorativos.
    horario_lugar: "Durante todo el año en el Centro Cívico de Nueva Sevilla. Modalidad presencial."
    imagenes:
      - src: "/images/taller-manualidades/manualidades-cuencos/cuencos2.jpg"
        alt: "Socios creando cuencos"
      - src: "/images/taller-manualidades/manualidades-abanico/abanico2.jpg"
        alt: "Socios creando abanicos"
      - src: "/images/taller-manualidades/manualidades-camisetas/camisetas2.jpg"
        alt: "Socios pintando camisetas"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-1.jpg"
        alt: "Socios creando llaveros"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-3.jpg"
        alt: "Socios pintando cuadros"
      - src: "/images/taller-manualidades/manualidades-otros/manualidades-2.jpg"
        alt: "Socios decorando tazas"

  - titulo: "Taller de Informática"
    descripcion: >
      Iniciación a la informática: uso básico del ordenador, procesadores
      de texto y navegación segura por internet.
    horario_lugar: "Durante el curso en el Centro Cívico de Nueva Sevilla. Modalidad presencial, 3 equipos disponibles."
    imagenes:
      - src: "/images/sede-informatica/informatica2.jpg"
        alt: "Socios aprendiendo informática"

  - titulo: "Taller de Baile"
    descripcion: >
      Actividad física y recreativa que promueve coordinación, ritmo
      y socialización mediante distintos estilos de baile.
    horario_lugar: "Durante el curso en el Centro Cívico de Nueva Sevilla. Modalidad presencial."
    imagenes:
      - src: "/images/taller-baile/baile.png"
        alt: "Socios bailando en el taller de baile"
